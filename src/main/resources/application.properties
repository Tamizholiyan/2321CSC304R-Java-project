# Server Configuration (using 8081 by default to prevent conflict with any active service on 8080)
server.port=${PORT:8081}

# Database Configuration (Defaults to H2 in PostgreSQL mode; can be overridden via SPRING_DATASOURCE_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:campuscommute;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Seed Data Initialization
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# JWT Security Configuration (HMAC-SHA256 256-bit secret)
campuscommute.jwt.secret=Fz/tMWfgxF9kfUEfIb3g8EiBhT9FX0JtXdG/6XP/P/Q=
# Access Token expiration: 15 minutes (900000 ms)
campuscommute.jwt.access-expiration-ms=900000
# Refresh Token expiration: 7 days (604800000 ms)
campuscommute.jwt.refresh-expiration-ms=604800000

# Google Routes API Configuration
app.google.routes.api-key=${GOOGLE_ROUTES_API_KEY:}
