# Server Configuration (using 8081 by default to prevent conflict with any active service on 8080)
server.port=${PORT:8081}

# Database Configuration (Defaults to H2 in PostgreSQL mode; overridden via profile or SPRING_DATASOURCE_* env vars)
# No driver-class-name or dialect is hardcoded so HikariCP and Hibernate auto-detect H2 or PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:campuscommute;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hikari Connection Pool: Cap at 5 connections to respect Supabase session pooler limits
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate Configuration: Use 'update' so existing tables and data are preserved (never 'create' or 'create-drop')
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Seed Data Initialization:
# Defer initialization so data.sql executes after Hibernate creates or updates tables
spring.jpa.defer-datasource-initialization=true
# Mode 'always' ensures data.sql runs on both embedded (H2) and non-embedded (PostgreSQL/Supabase) databases
spring.sql.init.mode=always
# Continue on error allows existing primary key records to be skipped without failing startup
spring.sql.init.continue-on-error=true

# Optional local properties import (gitignored, provides dev JWT_SECRET locally)
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

# JWT Security Configuration (secret must be provided via JWT_SECRET env var or application-local.properties)
campuscommute.jwt.secret=${JWT_SECRET}
# Access Token expiration: 15 minutes (900000 ms)
campuscommute.jwt.access-expiration-ms=900000
# Refresh Token expiration: 7 days (604800000 ms)
campuscommute.jwt.refresh-expiration-ms=604800000

# Google Routes API Configuration
app.google.routes.api-key=${GOOGLE_ROUTES_API_KEY:}

# Pricing Configuration
app.pricing.petrol-rate-per-litre=102.50

# Ride Scheduling & Proximity Configuration
schedule.window-minutes=90
rides.search.proximity-radius-km=5.0

