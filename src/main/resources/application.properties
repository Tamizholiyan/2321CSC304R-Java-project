# Server Configuration (using 8081 by default to prevent conflict with any active service on 8080)
server.port=${PORT:8081}

# Database Configuration (In-Memory H2 with MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:java_project;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# To switch back to a local MySQL server when available, uncomment the lines below:
# spring.datasource.url=jdbc:mysql://localhost:3306/java_project?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=admin123
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL Seed Data Initialization
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT Security Configuration (HMAC-SHA256 256-bit secret)
campuscommute.jwt.secret=Fz/tMWfgxF9kfUEfIb3g8EiBhT9FX0JtXdG/6XP/P/Q=
# Access Token expiration: 15 minutes (900000 ms)
campuscommute.jwt.access-expiration-ms=900000
# Refresh Token expiration: 7 days (604800000 ms)
campuscommute.jwt.refresh-expiration-ms=604800000

# Google Routes API Configuration
app.google.routes.api-key=${GOOGLE_ROUTES_API_KEY:}
